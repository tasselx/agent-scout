display_name: agent-scout Search & Vision
short_description: >-
  Web search and image captioning via the agent-scout tool (server-side
  Windsurf/Devin backend), zero-config with auto-discovered credentials.
default_prompt: >-
  Use agent-scout-search to look up current web facts, documentation, or
  research with `agent-scout "query"`, and to describe or analyze a local image
  with `agent-scout caption <image-path> [--question "..."]`.