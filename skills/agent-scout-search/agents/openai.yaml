display_name: agent-scout Search, Vision & Transcription
short_description: >-
  Web search, image captioning, and audio transcription via the agent-scout
  tool (server-side Windsurf/Devin backend), zero-config with auto-discovered
  credentials.
default_prompt: >-
  Use agent-scout-search to look up current web facts, documentation, or
  research with `agent-scout "query"`, to describe or analyze a local image
  with `agent-scout caption <image-path> [--question "..."]`, and to transcribe
  a local audio file with `agent-scout transcribe <audio-path>`.